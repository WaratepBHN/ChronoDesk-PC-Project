name: Deploy ChronoDesk website

on:
  push:
    branches: [main]
    paths: ['Web/**', '.github/workflows/chronodesk-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chronodesk-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build bilingual static page
        run: node Web/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
